# Conda environment for CWSR symbolic regression.
#
# Portable recipe (conda-forge) for the `cwsr` environment. Dependency
# versions are defined in the single source of truth, requirements.txt, which
# this file references below. Run from the repository root:
#
#     conda env create -f environment.yml
#     conda activate cwsr
#     pip install -e .
name: cwsr
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt

