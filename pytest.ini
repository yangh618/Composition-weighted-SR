[pytest]
# ---------------------------------------------------------------------------
# Test discovery (standard tests/unit + tests/integration layout)
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---------------------------------------------------------------------------
# Import path
# ---------------------------------------------------------------------------
# The repository root is prepended to sys.path so `cwsr`, `datasets` and
# `analysis` are importable from a plain checkout (no editable install needed).
pythonpath = .

# ---------------------------------------------------------------------------
# Defaults
# ---------------------------------------------------------------------------
# -ra           : show reasons for skipped / xfailed / failed tests
# --strict-markers : typo'd markers are errors, not silent no-ops
# --durations=10: surface slow tests (the tiny-search tests dominate)
addopts = -ra --strict-markers --durations=10

markers =
    slow: runs a tiny CWSR symbolic-regression search (seconds, deterministic)

# Recorded as xfail, never as a silent pass.
xfail_strict = false
